# Summit OS: use the modern "modesetting" X driver (with glamor GPU acceleration) on Intel graphics,
# instead of the old xf86-video-intel driver, which glitches and slows down with compositors on
# Haswell-era Macs. Only matches Intel GPUs (kernel driver i915); other hardware is unaffected.
Section "OutputClass"
    Identifier "Summit: modesetting on Intel"
    MatchDriver "i915"
    Driver "modesetting"
EndSection
