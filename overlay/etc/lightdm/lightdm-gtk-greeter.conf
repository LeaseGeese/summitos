[greeter]
background=/usr/share/backgrounds/summitos/summit-summit-light.jpg
theme-name=Orchis-Light
icon-theme-name=Summit-Blue
font-name=Inter 11
cursor-theme-name=Adwaita
user-background=false
default-user-image=/usr/share/pixmaps/summitos.png
indicators=~host;~spacer;~clock;~spacer;~power
clock-format=%a %b %-d  %-I:%M %p
position=50%,center 50%,center
round-user-image=true
