---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
instances:
- id: efisync
  module: shellprocess
  config: shellprocess-efisync.conf
- id: removelive
  module: shellprocess
  config: shellprocess-removelive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@removelive
  - initramfs
  - bootloader
  - shellprocess@efisync
  - umount
- show:
  - finished
branding: summit
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false
