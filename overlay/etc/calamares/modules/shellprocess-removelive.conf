---
# Runs inside the freshly installed system: take out everything that only the USB session needed
# (the live-session helpers, the installer and its libraries), and keep the kernel the drivers were built for.
dontChroot: false
timeout: 900
script:
    - "-DEBIAN_FRONTEND=noninteractive apt-get -y purge live-boot live-boot-initramfs-tools live-config live-config-systemd live-tools user-setup calamares qt6-qpa-plugins qt6-svg-plugins qml6-module-qtquick qml6-module-qtquick-window squashfs-tools"
    - "-DEBIAN_FRONTEND=noninteractive apt-get -y -o APT::AutoRemove::SuggestsImportant=false autoremove --purge"
    - "-rm -rf /etc/live /etc/calamares /etc/lightdm/lightdm.conf.d/90-summit-live.conf"
    - "-rm -f /usr/share/applications/summit-install.desktop /usr/local/bin/summit-install /etc/xdg/autostart/summit-live-setup.desktop /usr/local/bin/summit-live-setup"
    - "-/usr/local/sbin/summit-kernel-hold"
