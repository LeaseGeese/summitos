---
dontChroot: false
timeout: 600
script:
    - "-rm -f /etc/sudoers.d/casper"
    - "-DEBIAN_FRONTEND=noninteractive apt-get -y purge casper calamares"
    - "-DEBIAN_FRONTEND=noninteractive apt-get -y autoremove --purge"
    - "-rm -f /etc/lightdm/lightdm.conf.d/90-summit-live.conf"
    - "-rm -f /usr/share/applications/summit-install.desktop /etc/xdg/autostart/summit-live-setup.desktop"
    - "-update-grub"
