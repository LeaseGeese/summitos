---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"
userSwapChoices: [ none, file ]
initialSwapChoice: file
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultFileSystemType: "ext4"
availableFileSystemTypes: [ "ext4", "btrfs", "xfs" ]
partitionLayout:
    - name: "root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
# no whole-disk encryption yet: nothing can be typed at power-on with a Bluetooth keyboard (2.0 will encrypt home folders instead)
enableLuksAutomatedPartitioning: false
