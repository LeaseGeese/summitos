backend = "glx";
vsync = true;
use-damage = true;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.32;
shadow-offset-x = -18;
shadow-offset-y = -12;
shadow-exclude = ["class_g = 'Plank'", "class_g = 'Xfce4-panel'", "_GTK_FRAME_EXTENTS@:c", "window_type = 'dock'", "window_type = 'desktop'"];
corner-radius = 10;
rounded-corners-exclude = ["window_type = 'dock'", "window_type = 'desktop'", "class_g = 'Xfce4-panel'", "class_g = 'Plank'", "window_type = 'menu'", "window_type = 'dropdown_menu'", "window_type = 'popup_menu'", "window_type = 'tooltip'"];
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
detect-rounded-corners = true;
detect-client-opacity = true;
wintypes: { tooltip = { shadow = false; }; dock = { shadow = false; }; dnd = { shadow = false; }; };
