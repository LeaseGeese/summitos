# --- Summit OS memory tuning (pairs with zram) ---
# zram is fast, so let the kernel use it eagerly instead of dropping file cache
vm.swappiness = 150
# zram has no seek cost: swap single pages, not clusters of 8
vm.page-cluster = 0
# keep directory/inode cache around longer (big win on a slow hard drive)
vm.vfs_cache_pressure = 50
# avoid bursty reclaim stalls
vm.watermark_boost_factor = 0
# --- Hard-drive friendly write-back ---
# flush dirty data in smaller, more frequent batches so the HDD never
# has a huge backlog that freezes the desktop
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 134217728
vm.dirty_writeback_centisecs = 1500
# --- misc ---
kernel.nmi_watchdog = 0
