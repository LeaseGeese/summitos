# The Broadcom Wi-Fi cards in 2012-2015 Macs (BCM4331, BCM4360 and relatives) only work with the "wl"
# driver that Summit builds into the image. These other drivers claim the same cards and must stay out.
blacklist b43
blacklist b43legacy
blacklist b44
blacklist bcma
blacklist brcm80211
blacklist brcmsmac
blacklist ssb
