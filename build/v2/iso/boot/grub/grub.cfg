search --no-floppy --set=root --file /summitos.marker
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod font
set gfxmode=1920x1080,auto
set gfxpayload=keep
terminal_output gfxterm
loadfont $prefix/themes/summit/inter-16.pf2
loadfont $prefix/themes/summit/inter-22.pf2
loadfont $prefix/themes/summit/inter-bold-30.pf2
set theme=$prefix/themes/summit/theme.txt
set default=0
set timeout=8

menuentry "Try Summit OS" {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}
menuentry "Summit OS — safe graphics" {
    linux /live/vmlinuz boot=live components nomodeset quiet splash
    initrd /live/initrd.img
}
menuentry "Summit OS — run from memory" {
    linux /live/vmlinuz boot=live components toram quiet splash
    initrd /live/initrd.img
}
