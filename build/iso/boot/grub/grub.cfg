search --no-floppy --set=root --file /summitos.marker
insmod all_video
insmod gfxterm
insmod png
insmod gfxmenu
insmod font
set gfxmode=1920x1080,auto
set gfxpayload=keep
terminal_output gfxterm
loadfont $prefix/themes/summit/inter-16.pf2
loadfont $prefix/themes/summit/inter-22.pf2
loadfont $prefix/themes/summit/inter-bold-30.pf2
set theme=$prefix/themes/summit/theme.txt
set default=0
set timeout=8

menuentry "Try or Install Summit OS" {
    linux /casper/vmlinuz boot=casper quiet splash ---
    initrd /casper/initrd
}
menuentry "Summit OS — safe graphics" {
    linux /casper/vmlinuz boot=casper nomodeset quiet splash ---
    initrd /casper/initrd
}
menuentry "Summit OS — run from memory" {
    linux /casper/vmlinuz boot=casper toram quiet splash ---
    initrd /casper/initrd
}
